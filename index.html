<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Hayley Tymony">
  <title>Bear Ninja Hunter - Prototype 3</title>
</head>
<body>
  <p id="demo">The game results will appear here.</p>

  <script>
    // ====== Variable Declarations ======
    const gameChoices = ["Bear", "Ninja", "Hunter"]; // Available choices
    let userName = ""; // Stores user's name
    let playerChoice = ""; // Stores player's choice
    let computerChoice = ""; // Stores computer's random choice
    let playAgain = true; // Controls the game loop
    let finalMessage = ""; // Full output message

    // ====== Main Game Loop ======
    while (playAgain) {
      // ====== Welcome & Get Name ======
      userName = prompt("Welcome to Bear Ninja Hunter! Enter if you dare. To continue, please enter your name:");

      // Handle cancel or empty name input
      if (userName === null || userName.trim() === "") {
        alert("Game canceled. Please refresh the page to play again.");
        break;
      }

      // ====== Display Available Choices Using FOR LOOP ======
      let choicesList = "Choose one of the following: ";
      for (let i = 0; i < gameChoices.length; i++) {
        choicesList += gameChoices[i];
        if (i < gameChoices.length - 1) choicesList += ", ";
      }
      alert("Welcome " + userName + "! " + choicesList);

      // ====== Get Player Choice ======
      playerChoice = prompt("Choose Bear, Ninja, or Hunter:");

      // Handle cancel or empty input
      if (playerChoice === null || playerChoice.trim() === "") {
        alert("Invalid input! You must type Bear, Ninja, or Hunter exactly.");
        break;
      }

      // ====== Force Case to Title Case ======
      playerChoice = playerChoice.trim().toLowerCase();
      playerChoice = playerChoice.charAt(0).toUpperCase() + playerChoice.slice(1);

      // ====== Validate Player Choice ======
      if (!gameChoices.includes(playerChoice)) {
        alert("Invalid input! You must type Bear, Ninja, or Hunter exactly.");
        break;
      }

      // ====== Generate Random Computer Choice ======
      let randomIndex = Math.floor(Math.random() * gameChoices.length);
      computerChoice = gameChoices[randomIndex];

      // ====== Determine Winner Using IF/ELSE ======
      let resultMessage = "";
      if (playerChoice === computerChoice) {
        resultMessage = "It's a tie!";
      } else if (
        (playerChoice === "Bear" && computerChoice === "Ninja") ||
        (playerChoice === "Ninja" && computerChoice === "Hunter") ||
        (playerChoice === "Hunter" && computerChoice === "Bear")
      ) {
        resultMessage = "You win!";
      } else {
        resultMessage = "Computer wins!";
      }

      // ====== SWITCH Statement (Required) ======
      switch (playerChoice) {
        case "Bear":
          console.log(userName + " chose Bear.");
          break;
        case "Ninja":
          console.log(userName + " chose Ninja.");
          break;
        case "Hunter":
          console.log(userName + " chose Hunter.");
          break;
        default:
          console.log("Invalid choice.");
      }

      // ====== Build Final Message ======
      finalMessage = userName + ", you chose " + playerChoice +
                     ", and the computer chose " + computerChoice + ". " +
                     resultMessage;

      // ====== Display Results (2 Output Methods) ======
      document.getElementById("demo").innerHTML = finalMessage;
      alert(finalMessage);
      console.log(finalMessage);

      // ====== Ask to Play Again ======
      let again = prompt("Do you want to play again? Type Yes or No.");
      if (again === null || again.trim().toLowerCase() !== "yes") {
        alert("Thanks for playing, " + userName + "! Refresh the page to start over.");
        playAgain = false;
      }
    }
  </script>
</body>
</html>
